<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Member Form</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Georgia, "Times New Roman", serif; margin: 0; padding: 16px; background: #f3f4f6; color: #111; }
  .sheet { max-width: 800px; margin: 0 auto; background: #fff; padding: 28px; border: 1px solid #ccc; }
  .head { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #111; padding-bottom: 8px; margin-bottom: 14px; }
  .head h1 { margin: 0; font-size: 28px; }
  .nobox { border: 2px solid #111; padding: 4px 10px; font-weight: bold; display: flex; align-items: center; gap: 6px; }
  .nobox input { width: 70px; border: 0; border-bottom: 1px solid #888; font: inherit; font-weight: bold; text-align: center; background: transparent; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid #555; padding: 8px 10px; text-align: left; }
  th { width: 32%; background: #f1f1f1; font-size: 15px; }
  td input, td select { width: 100%; border: 0; font: inherit; font-size: 16px; background: transparent; outline: none; padding: 2px 0; }
  td input:focus { background: #eef4ff; }
  .upper { text-transform: uppercase; }
  .amt { display: flex; gap: 6px; align-items: center; }
  .amt select { width: 56px; flex: none; }
  h2 { font-size: 17px; margin: 18px 0 6px; }
  .sigimg { height: 90px; display: flex; align-items: flex-end; }
  .sigimg img { max-height: 90px; max-width: 70%; }
  .sigline { width: 70%; border-top: 1px solid #000; margin-top: 2px; }
  .signame { font-weight: bold; margin-top: 4px; min-height: 18px; }
  .sigcap { font-size: 14px; }

  #proofList { border: 1px solid #999; min-height: 380px; padding: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; align-content: flex-start; }
  #proofList:empty::before { content: "Proof of documents will show here"; color: #aaa; font-size: 13px; }
  .pimg { break-inside: avoid; }
  .pimg img { width: 100%; height: auto; display: block; }
  .ctl { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; font-family: Arial, sans-serif; font-size: 12px; }
  .ctl input[type=range] { flex: 1; min-width: 40px; }
  .ctl button { border: 0; border-radius: 4px; background: #555; color: #fff; padding: 4px 8px; font-size: 14px; cursor: pointer; }
  .ctl button.x { background: #b91c1c; }

  .buttons { max-width: 800px; margin: 14px auto 0; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button.main { padding: 10px 18px; font-size: 15px; border: 0; border-radius: 4px; background: #2563eb; color: #fff; cursor: pointer; font-family: inherit; }
  button.gray { background: #555; }
  #msg { text-align: center; margin-top: 10px; font-size: 14px; color: #166534; min-height: 18px; }
  .note { max-width: 800px; margin: 10px auto 0; font-size: 12px; color: #666; text-align: center; }
  .locked input[type=file], .locked .ctl { display: none; }
  .locked td input, .locked .nobox input { pointer-events: none; }
  .locked select { pointer-events: none; appearance: none; -webkit-appearance: none; }

  @page { size: A4; margin: 10mm; }
  @media print {
    body { background: #fff; padding: 0; }
    .sheet { border: 0; padding: 0; max-width: none; }
    .buttons, .note, #msg, input[type=file], .ctl { display: none !important; }
    select { appearance: none; -webkit-appearance: none; }
    #proofList:empty::before { content: ""; }
    #proofList { min-height: 120mm; }
  }
</style>
</head>
<body>
<div class="sheet" id="sheet">
  <div class="head">
    <h1>Member Form</h1>
    <div class="nobox">No. <input type="text" id="number"></div>
  </div>

  <table>
    <tr><th>Date</th><td><input type="text" id="date"></td></tr>
    <tr><th>Name</th><td><input type="text" id="name" class="upper"></td></tr>
    <tr><th>Middle name</th><td><input type="text" id="middle" class="upper"></td></tr>
    <tr><th>Surname</th><td><input type="text" id="surname" class="upper"></td></tr>
    <tr><th>Address</th><td><input type="text" id="address" class="upper"></td></tr>
    <tr><th>Contact number</th><td><input type="tel" id="contact"></td></tr>
    <tr><th>Amount</th><td>
      <div class="amt">
        <select id="currency"><option>₱</option><option>$</option><option>€</option></select>
        <input type="text" id="amount" inputmode="decimal" placeholder="0.00">
      </div>
    </td></tr>
  </table>

  <h2>Signature</h2>
  <input type="file" id="sigFile" accept="image/png,image/jpeg">
  <div class="sigimg" id="sigBox"></div>
  <div class="sigline"></div>
  <div class="signame" id="fullName"></div>
  <div class="sigcap">Signature</div>

  <h2>Proof of documents</h2>
  <input type="file" id="proofFile" accept="image/*" multiple>
  <div id="proofList"></div>
</div>

<div id="msg"></div>
<div class="buttons">
  <button class="main" onclick="submitForm()">Submit</button>
  <button class="main" onclick="saveForm()">Save</button>
  <button class="main gray" onclick="setLocked(false)">Edit</button>
  <button class="main gray" onclick="setLocked(true)">Preview</button>
  <button class="main" onclick="window.print()">Print</button>
</div>
<p class="note">If the print window doesn’t open, open this page in its own browser tab and press Ctrl+P (Cmd+P on Mac). Only the form above will print.</p>

<script>
  var ids = ['number','date','name','middle','surname','address','contact','currency','amount'];
  var sigData = '';
  var proof = [];   /* each item: { src: dataURL, w: width in percent } */

  function $(id) { return document.getElementById(id); }
  function msg(t) { $('msg').textContent = t; }

  function todayText() {
    return new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function updateName() {
    $('fullName').textContent = [$('name').value, $('middle').value, $('surname').value]
      .filter(function (s) { return s.trim(); }).join(' ').toUpperCase();
  }
  ['name','middle','surname'].forEach(function (i) { $(i).addEventListener('input', updateName); });

  /* Amount with commas */
  $('amount').addEventListener('input', function () {
    var v = this.value.replace(/[^\d.]/g, '');
    var p = v.split('.');
    var whole = p[0].replace(/^0+(?=\d)/, '').replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    this.value = p.length > 1 ? whole + '.' + p.slice(1).join('').slice(0, 2) : whole;
  });
  $('amount').addEventListener('blur', function () {
    var v = this.value.replace(/,/g, '');
    if (v === '' || isNaN(v)) return;
    this.value = parseFloat(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  });

  /* Signature */
  function showSig() {
    var box = $('sigBox');
    box.innerHTML = '';
    if (sigData) { var img = new Image(); img.src = sigData; box.appendChild(img); }
  }
  $('sigFile').addEventListener('change', function (e) {
    var f = e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { sigData = r.result; showSig(); };
    r.readAsDataURL(f);
  });

  /* Proof of documents */
  function setWidth(el, w) { el.style.width = 'calc(' + w + '% - 8px)'; }

  function move(i, d) {
    var j = i + d;
    if (j < 0 || j >= proof.length) return;
    var t = proof[i]; proof[i] = proof[j]; proof[j] = t;
    renderProof();
  }

  function renderProof() {
    var box = $('proofList');
    box.innerHTML = '';
    proof.forEach(function (item, i) {
      var w = document.createElement('div');
      w.className = 'pimg';
      setWidth(w, item.w);

      var ctl = document.createElement('div');
      ctl.className = 'ctl';

      var left = document.createElement('button'); left.textContent = '◀';
      left.onclick = function () { move(i, -1); };
      var right = document.createElement('button'); right.textContent = '▶';
      right.onclick = function () { move(i, 1); };

      var slider = document.createElement('input');
      slider.type = 'range'; slider.min = 15; slider.max = 100; slider.step = 5; slider.value = item.w;
      slider.oninput = function () { item.w = parseInt(slider.value, 10); setWidth(w, item.w); };

      var rm = document.createElement('button'); rm.className = 'x'; rm.textContent = '×';
      rm.onclick = function () { proof.splice(i, 1); renderProof(); };

      ctl.appendChild(left); ctl.appendChild(slider); ctl.appendChild(right); ctl.appendChild(rm);

      var img = new Image(); img.src = item.src;
      w.appendChild(ctl); w.appendChild(img);
      box.appendChild(w);
    });
  }

  $('proofFile').addEventListener('change', function (e) {
    var files = Array.prototype.slice.call(e.target.files);
    Promise.all(files.map(function (f) {
      return new Promise(function (res) {
        var r = new FileReader();
        r.onload = function () { res({ src: r.result, w: 50 }); };
        r.readAsDataURL(f);
      });
    })).then(function (list) { proof = proof.concat(list); renderProof(); e.target.value = ''; });
  });

  /* Save / load */
  function saveForm() {
    var data = { sig: sigData, proof: proof };
    ids.forEach(function (i) { data[i] = $(i).value; });
    try { localStorage.setItem('memberForm', JSON.stringify(data)); msg('Saved on this device.'); return; }
    catch (e) {}
    try {
      data.proof = [];
      localStorage.setItem('memberForm', JSON.stringify(data));
      msg('Saved, but the documents are too big to save. Add them again next time.');
    } catch (e2) { msg('Could not save on this device.'); }
  }
  function loadForm() {
    try {
      var d = JSON.parse(localStorage.getItem('memberForm') || 'null');
      if (d) {
        ids.forEach(function (i) { if (d[i] !== undefined) $(i).value = d[i]; });
        sigData = d.sig || '';
        proof = (d.proof || []).map(function (p) {
          return typeof p === 'string' ? { src: p, w: 50 } : p;
        });
      }
    } catch (e) {}
    if (!$('date').value) $('date').value = todayText();
    showSig(); renderProof(); updateName();
  }

  function setLocked(on) {
    $('sheet').classList.toggle('locked', on);
    msg(on ? 'Preview mode. Print.' : '');
  }
  function submitForm() {
    saveForm();
    setLocked(true);
  }

  loadForm();
</script>
</body>
</html>
